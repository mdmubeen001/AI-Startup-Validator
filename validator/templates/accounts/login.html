{% extends 'base_guest.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue</p>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
