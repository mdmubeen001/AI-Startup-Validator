{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Startup Validator landing page for startup idea validation and reports." />
    <title>{% block title %}AI Startup Validator{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="guest-page">
    <header class="navbar guest-navbar">
        <div class="navbar-inner container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <span class="navbar-logo">AI</span>
                <span class="navbar-title">Validator</span>
            </a>
            <nav class="navbar-menu">
                <a href="{% url 'home' %}" class="navbar-link">Home</a>
                <a href="{% url 'login' %}" class="navbar-link">Login</a>
                <a href="{% url 'register' %}" class="btn btn--primary">Register</a>
            </nav>
        </div>
    </header>

    <main class="guest-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer footer--guest">
        <div class="container footer-inner">
            <div>
                <p class="footer-copy">&copy; {% now "Y" %} AI Startup Validator</p>
                <p class="footer-tag">Built for founders, operators, and product builders.</p>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </footer>
</body>
</html>
