{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Startup Validator landing page for startup idea validation and reports.">
    <title>{% block title %}AI Startup Validator{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a class="navbar-brand" href="{% url 'home' %}">
                <div class="navbar-logo">AI</div>
                <span class="navbar-title">AI Startup Validator</span>
            </a>
            <nav class="navbar-center">
                <a href="{% url 'home' %}" class="navbar-link">Home</a>

            </nav>
            <nav class="navbar-right">
                <a href="{% url 'login' %}" class="btn btn-secondary">Login</a>
                <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
            </nav>
        </div>
    </header>

    <main class="guest-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <p class="footer-copy">&copy; {% now "Y" %} AI Startup Validator</p>
                <p class="footer-tag">Built for founders, operators, and product builders.</p>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </footer>
</body>
</html>
